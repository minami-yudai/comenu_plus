name: Scrape and update CSV

on:
  schedule:
    - cron: "0 4 * * *"   # 毎日 UTC 3時(日本時間 正午12時)に実行
  workflow_dispatch:        # 手動実行もできるようにする

permissions:
  contents: write   # リポジトリへの書き込み(push)を許可

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraping.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update data.json"
          git push